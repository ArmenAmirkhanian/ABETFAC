{% extends 'base.html' %}
{% block title %}Log In{% endblock %}

{% block content %}
<div class="login-card">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-clipboard-check display-5 text-primary"></i>
        <h4 class="mt-2 fw-bold">ABET Assessment</h4>
        <p class="text-muted small">Faculty Assessment Portal</p>
      </div>

      <form method="post" action="{{ url_for('auth.login') }}">


        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <input type="text" class="form-control form-control-lg" id="username" name="username"
                 autofocus autocomplete="username" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control form-control-lg" id="password" name="password"
                 autocomplete="current-password" required>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="remember" name="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">
          <i class="bi bi-box-arrow-in-right"></i> Log In
        </button>
      </form>
    </div>
  </div>
  <p class="text-center text-muted small mt-3">Contact your administrator if you need access.</p>
</div>
{% endblock %}
